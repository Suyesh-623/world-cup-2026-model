name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The math tests need only pytest; requirements.txt also pulls the heavy data pipeline.
      - run: pip install "pytest>=8.0"
      # Runs from a clone named after the repo, the way a visitor would (conftest.py resolves `model`).
      - run: python -m pytest -q
